name: macOS build

# Builds the game and the launcher for Apple Silicon. The release archive is assembled from this
# artifact by tools/release/public-release.sh in the Moo2Mods workspace, like the Linux and
# Windows builds; nothing here publishes anything.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      # The runner's own macOS otherwise; 11 (Big Sur) is the first release for Apple Silicon.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        run: |
          test "$(uname -m)" = arm64
          command -v ninja >/dev/null || brew install ninja
          cmake --preset osx-release
          cmake --build --preset osx-release --target orion2re antares-launcher package-runtime-data --parallel 3
      - name: Check the binaries
        working-directory: out/build/Darwin/osx-release
        run: |
          for B in antares antares-launcher; do
            file "$B"
            otool -L "$B"
            # Only system libraries and frameworks: a Homebrew library would not be on the player's Mac.
            if otool -L "$B" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
              echo "$B links a library outside the system" >&2
              exit 1
            fi
            codesign --verify --verbose "$B"
            vtool -show-build "$B" | grep -E 'minos|platform'
            vtool -show-build "$B" | grep -qE 'minos 11\.0$' || { echo "$B needs a newer macOS than 11" >&2; exit 1; }
          done
      - name: Stage
        run: |
          B=out/build/Darwin/osx-release
          mkdir -p stage/data/mods
          cp "$B/antares" "$B/antares-launcher" stage/
          cp "$B/data/base.zip" stage/data/
          cp "$B"/data/mods/*.zip stage/data/mods/
          echo "$GITHUB_SHA" > stage/COMMIT
          # A tar keeps the executable bits that an artifact zip would lose.
          tar -C stage -czf antares-macos-arm64.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antares-macos-arm64
          path: antares-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
