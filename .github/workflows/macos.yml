name: macOS build

# Builds the game and the launcher for Apple Silicon. The release archive is assembled from this
# artifact by tools/release/public-release.sh in the Moo2Mods workspace, like the Linux and
# Windows builds; nothing here publishes anything.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      # The runner's own macOS otherwise; 11 (Big Sur) is the first release for Apple Silicon.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        run: |
          test "$(uname -m)" = arm64
          command -v ninja >/dev/null || brew install ninja
          cmake --preset osx-release
          cmake --build --preset osx-release --target orion2re antares-launcher package-runtime-data --parallel 3
      - name: Check the binaries
        working-directory: out/build/Darwin/osx-release
        run: |
          for B in antares antares-launcher; do
            file "$B"
            otool -L "$B"
            # Only system libraries and frameworks: a Homebrew library would not be on the player's Mac.
            if otool -L "$B" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
              echo "$B links a library outside the system" >&2
              exit 1
            fi
            codesign --verify --verbose "$B"
            vtool -show-build "$B" | grep -E 'minos|platform'
            vtool -show-build "$B" | grep -qE 'minos 11\.0$' || { echo "$B needs a newer macOS than 11" >&2; exit 1; }
          done
      - name: Build the Godot library
        run: |
          cmake -S . -B out/build/osx-godot -G Ninja -DCMAKE_BUILD_TYPE=Release -DORION2RE_BUILD_TESTS=OFF \
            -DANTARES_BUILD_GODOT=ON -DANTARES_GODOT_BIN_DIR="$PWD/out/build/osx-godot/bin"
          cmake --build out/build/osx-godot --target antares_godot --parallel 3
          L=out/build/osx-godot/bin/libantares.dylib
          file "$L"
          otool -L "$L"
          if otool -L "$L" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/|@rpath/libantares)'; then
            echo "libantares.dylib links a library outside the system" >&2
            exit 1
          fi
      - name: Godot 4.7.2 and its export templates
        id: godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot-cache
          key: godot-4.7.2-macos
      - name: Download Godot (when not cached)
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-cache
          curl -fsSL -o godot-cache/editor.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          curl -fsSL -o godot-cache/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
      - name: Export the Godot build (antares-godot.app)
        run: |
          unzip -q godot-cache/editor.zip -d godot
          GODOT="$PWD/godot/Godot.app/Contents/MacOS/Godot"
          T="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$T"
          unzip -q -j godot-cache/templates.tpz 'templates/macos.zip' 'templates/version.txt' -d "$T"
          # As tools/release/export-godot.sh: the project without the editor cache and dev library,
          # only the built-in interface among the packages (themes ship as packages).
          P="$PWD/godot-stage"
          rsync -a --exclude '.godot/' --exclude 'bin/' --exclude '.gitignore' frontend/godot/project/ "$P/"
          mkdir -p "$P/bin"
          cp out/build/osx-godot/bin/libantares.dylib "$P/bin/"
          for PKG in "$P"/packages/*/; do [ "$(basename "$PKG")" = antares-ui ] || rm -rf "$PKG"; done
          # Godot 4.7.2 aborts at the end of the first headless import of a project with a GDExtension.
          "$GODOT" --headless --path "$P" --import || true
          "$GODOT" --headless --path "$P" --import
          mkdir -p godot-out
          "$GODOT" --headless --path "$P" --export-release macOS "$PWD/godot-out/antares-godot.app"
          test -d godot-out/antares-godot.app
          # Apple Silicon runs only signed code: an ad-hoc signature (no Apple account; players
          # still clear the quarantine flag, as INSTALL.txt says).
          codesign --force --deep -s - godot-out/antares-godot.app
          codesign --verify --deep --verbose godot-out/antares-godot.app
          ls -la godot-out/antares-godot.app/Contents/MacOS godot-out/antares-godot.app/Contents/Frameworks || true
      - name: Stage
        run: |
          B=out/build/Darwin/osx-release
          mkdir -p stage/data/mods
          cp "$B/antares" "$B/antares-launcher" stage/
          cp -R godot-out/antares-godot.app stage/
          cp "$B/data/base.zip" stage/data/
          cp "$B"/data/mods/*.zip stage/data/mods/
          echo "$GITHUB_SHA" > stage/COMMIT
          # A tar keeps the executable bits that an artifact zip would lose.
          tar -C stage -czf antares-macos-arm64.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antares-macos-arm64
          path: antares-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
      # WP5.17: one self-contained app on a disk image. Everything the game needs is inside the
      # bundle (Resources/ is the program's folder: SDL's base path in an app), the user-folder
      # marker keeps saves and settings in ~/Library/Application Support, and the app is signed
      # (ad hoc) only once everything is in it, or macOS calls it damaged.
      - name: Package the app (Battle at Antares.app, disk image)
        run: |
          V=$(sed -n 's/.*PRODUCT_VERSION\[\] = "\([^"]*\)".*/\1/p' src/antares/identity.h)
          B=out/build/Darwin/osx-release
          APP="pkg/Battle at Antares.app"
          C="$APP/Contents"
          R="$C/Resources"
          rm -rf pkg && mkdir -p "$C/MacOS" "$R/data/mods" "$R/licenses"
          cp "$B/antares-launcher" "$C/MacOS/"
          cp "$B/antares" "$R/"
          cp -R godot-out/antares-godot.app "$R/"
          cp "$B/data/base.zip" "$R/data/"
          cp "$B"/data/mods/*.zip "$R/data/mods/"
          cp data/antares.cfg "$R/data/antares.cfg"
          printf '\n# The themes of the native interface (Options > Theme switches; the last is the default).\nenable antares-ui-glass;\nenable antares-ui-chrome;\n' >> "$R/data/antares.cfg"
          for T in antares-ui-glass antares-ui-chrome; do
            python3 - "$PWD/frontend/godot/project" "$T" "$R/data/mods/$T.zip" <<'PY'
          import io, sys, zipfile
          from pathlib import Path
          src, pkg, out = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          root = src / "packages" / pkg
          pack = io.BytesIO()
          with zipfile.ZipFile(pack, "w", zipfile.ZIP_DEFLATED) as z:
              for f in sorted(root.rglob("*")):
                  if f.is_file():
                      z.write(f, f.relative_to(src).as_posix())
          with zipfile.ZipFile(out, "w", zipfile.ZIP_STORED) as z:
              for name in ["mod.json5", "README.md", "config/main.cfg"]:
                  z.write(root / name, name)
              z.writestr(f"godot/{pkg}.zip", pack.getvalue())
          PY
          done
          cp frontend/godot/licenses/* "$R/licenses/"
          cp LICENSE "$R/LICENSE"
          for D in SDL imgui libsmacker libuv libwebp lz4 lzma miniz stb yyjson; do
            for F in vendors/$D/LICENSE vendors/$D/LICENSE.txt vendors/$D/LICENSE.md vendors/$D/COPYING; do
              [ -f "$F" ] && cp "$F" "$R/licenses/$D-$(basename "$F")"
            done
          done
          printf 'This file keeps saves, settings, packages and the copied Master of Orion II files in\n~/Library/Application Support/Battle at Antares, not in this app.\n' > "$R/user-folder"
          cp resources/icons/antares.icns "$R/antares.icns"
          cat > "$C/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>io.github.crono141.battle-at-antares</string>
              <key>CFBundleName</key><string>Battle at Antares</string>
              <key>CFBundleDisplayName</key><string>Battle at Antares</string>
              <key>CFBundleExecutable</key><string>antares-launcher</string>
              <key>CFBundleIconFile</key><string>antares</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>$V</string>
              <key>CFBundleVersion</key><string>$V</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>LSApplicationCategoryType</key><string>public.app-category.strategy-games</string>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$C/Info.plist"
          plutil -lint "$C/Info.plist"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          for i in 1 2 3; do
            hdiutil create -volname "Battle at Antares" -srcfolder dmgroot -ov -format UDZO "battle-at-antares-$V-macos-arm64.dmg" && break
            sleep 10
          done
          ls -la *.dmg
      - name: Check the app from the disk image
        run: |
          DMG=$(ls *.dmg)
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}')
          CHECK="$RUNNER_TEMP/check"
          mkdir -p "$CHECK" && cp -R "$MNT/Battle at Antares.app" "$CHECK/"
          hdiutil detach "$MNT"
          APP="$CHECK/Battle at Antares.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "== Gatekeeper's verdict (ad hoc: expected rejected; the first-run text covers it):"
          spctl -a -vv "$APP" || true
          echo "== the launcher, headless:"
          SDL_VIDEODRIVER=dummy SDL_AUDIO_DRIVER=dummy "$APP/Contents/MacOS/antares-launcher" -setup -screenshot "$RUNNER_TEMP/welcome.png" 2>&1 | head -8 || true
          ls -la "$RUNNER_TEMP/welcome.png"
          ls "$HOME/Library/Application Support/Battle at Antares/" || true
          echo "== the engine with no game files (expects its missing-files message):"
          (cd "$APP/Contents/Resources" && SDL_VIDEODRIVER=dummy SDL_AUDIO_DRIVER=dummy ./antares -log; echo "exit $?") 2>&1 | grep -iE "original|missing|exit|data directory|user paths" | head -6 || true
          echo "== the seal after running (nothing wrote into the app):"
          codesign --verify --deep --strict --verbose=2 "$APP"
          cp "$RUNNER_TEMP/welcome.png" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battle-at-antares-macos-app
          path: |
            *.dmg
            welcome.png
          if-no-files-found: error
          retention-days: 30
